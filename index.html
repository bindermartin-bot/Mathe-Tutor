<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Tutoring V6</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef1f6;
}

.screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    max-width:700px;
}

button{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#469542;
    color:#fff;
    cursor:pointer;
}

textarea{
    width:100%;
    max-width:600px;
    height:120px;
}

canvas{
    border:1px solid #ccc;
    background:white;
    touch-action:none;
}

/* popup */
#popup{
    position:fixed;
    inset:0;
    display:none;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}
#popup img{
    max-width:90%;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen">
<h1>Socratic Tutoring</h1>
<p>Fach wählen</p>

<div class="grid">
<button onclick="selectSubject('Mathematik')">Mathe</button>
<button onclick="selectSubject('Deutsch')">Deutsch</button>
<button onclick="selectSubject('Englisch')">Englisch</button>
<button onclick="selectSubject('Französisch')">Französisch</button>
<button onclick="selectSubject('Biologie')">Bio</button>
<button onclick="selectSubject('Chemie')">Chemie</button>
<button onclick="selectSubject('Physik')">Physik</button>
<button onclick="selectSubject('Geschichte')">Geschichte</button>
<button onclick="selectSubject('Wirtschaft und Recht')">W&R</button>
</div>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen" style="display:none;">
<h2 id="subjectTitle"></h2>

<textarea id="taskText" placeholder="Aufgabe eingeben"></textarea>

<br>

<input type="file" id="imageInput">
<div id="imageBox"></div>

<br>

<canvas id="canvas" width="500" height="300"></canvas>

<br>

<button onclick="copyText()">📋 Text kopieren</button>
<button onclick="copyCanvas()">🖼️ Zeichnung kopieren</button>
<button onclick="openKI()">🤖 KI öffnen</button>
</div>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
<img id="popupImg">
</div>

<script>

window.addEventListener("load", () => {

const appState={
    subject:null,
    image:null,
    drawing:false
};

/* Fach */
window.selectSubject=(s)=>{
    appState.subject=s;
    document.getElementById("screen1").style.display="none";
    document.getElementById("screen2").style.display="flex";
    document.getElementById("subjectTitle").innerText=s;
};

/* Bild */
document.getElementById("imageInput").addEventListener("change", e=>{
    const file=e.target.files[0];
    if(!file)return;

    const r=new FileReader();
    r.onload=ev=>{
        appState.image=ev.target.result;
        imageBox.innerHTML=`<img src="${appState.image}" onclick="openPopup()" style="max-width:300px;p=()=>{
    popupImg.src=appState.image;
    popup.style.display="flex";
};

window.closePopup=()=>popup.style.display="none";

/* Canvas */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.addEventListener("mousedown", e=>{
    appState.drawing=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener("mousemove", e=>{
    if(!appState.drawing)return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>appState.drawing=false);

/* Copy */
window.copyText=async()=>{
    const txt=taskText.value;
    await navigator.clipboard.writeText(txt);
    alert("Kopiert");
};

window.copyCanvas=()=>{
    canvas.toBlob(async b=>{
        await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);
        alert("Bild kopiert");
    });
};

/* Split */
window.openKI=()=>{
    const w=screen.width;
    const left=window.open(window.location.href + "?app","app",
        `width=${w*0.65},height=${screen.height}`);

    const right=window.open("https://chatgpt.com","ki",
        `width=${w*0.35},height=${screen.height}`);

    if(!right) alert("Popup blockiert!");
};

});

</script>
</body>
</html>
