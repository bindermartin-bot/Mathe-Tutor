<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Tutoring V6 FINAL</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#eef1f6;
}

.screen {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    max-width:700px;
    width:100%;
}

button {
    padding:10px;
    border:none;
    border-radius:8px;
    background:#469542;
    color:white;
    cursor:pointer;
}

textarea {
    width:100%;
    max-width:600px;
    height:120px;
}

/* Image */
#imageBox img {
    max-width:300px;
    cursor:zoom-in;
    margin-top:10px;
}

/* Canvas */
canvas {
    border:1px solid #ccc;
    background:white;
    margin-top:10px;
}

/* Popup */
#popup {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}
#popup img {
    max-width:90%;
}
</style>
</head>

<body>

<!-- START -->
<div id="screen1" class="screen">
    <h1>Socratic Tutoring</h1>
    <p>Fach wählen:</p>

    <div class="grid">
        <button onclick="selectSubject('Deutsch')">Deutsch</button>
        <button onclick="selectSubject('Französisch')">Französisch</button>
        <button onclick="selectSubject('Englisch')">Englisch</button>
        <button onclick="selectSubject('Mathematik')">Mathematik</button>
        <button onclick="selectSubject('Geschichte')">Geschichte</button>
        <button onclick="selectSubject('Wirtschaft und Recht')">W&R</button>
        <button onclick="selectSubject('Biologie')">Biologie</button>
        <button onclick="selectSubject('Physik')">Physik</button>
        <button onclick="selectSubject('Chemie')">Chemie</button>
    </div>
</div>

<!-- APP -->
<div id="screen2" class="screen" style="display:none;">
    <h2 id="subjectTitle"></h2>

    <textarea id="taskText" placeholder="Aufgabe eingeben..."></textarea>

    <br>

    <input type="file" id="imageInput">
    <div id="imageBox"></div>

    <canvas id="canvas" width="500" height="300"></canvas>

    <br>

    <button onclick="copyText()">📋 Text kopieren</button>
    <button onclick="copyCanvas()">🖼️ Zeichnung kopieren</button>
    <button onclick="openKI()">🤖 KI öffnen</button>
    <button onclick="goBack()">↩ Zurück</button>
</div>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
    <img id="popupImg">
</div>

<!-- ✅ SCRIPT AM ENDE = WICHTIG -->
<script>

/* STATE */
const appState = {
    subject:null,
    image:null,
    drawing:false
};

/* SUBJECT */
function selectSubject(subject){
    appState.subject = subject;

    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "flex";
    document.getElementById("subjectTitle").innerText = subject;
}

/* BACK */
function goBack(){
    document.getElementById("screen1").style.display = "flex";
    document.getElementById("screen2").style.display = "none";
}

/* IMAGE */
document.getElementById("imageInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){
        appState.image = ev.target.result;

        document.getElementById("imageBox").innerHTML =
            '<img src="'+appState.image+'" onclick="openPopup()">';
    };

    reader.readAsDataURL(file);
});

/* POPUP */
function openPopup(){
    if(!appState.image) return;

    document.getElementById("popupImg").src = appState.image;
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

/* CANVAS */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.addEventListener("mousedown", function(e){
    appState.drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", function(e){
    if(!appState.drawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

canvas.addEventListener("mouseup", function(){
    appState.drawing = false;
});

/* COPY TEXT */
function copyText(){
    const txt = document.getElementById("taskText").value;

    navigator.clipboard.writeText(txt)
    .then(()=>alert("Kopiert"))
    .catch(()=>prompt("Kopieren:",txt));
}

/* COPY CANVAS */
function copyCanvas(){
    canvas.toBlob(function(blob){
        navigator.clipboard.write([
            new ClipboardItem({'image/png': blob})
        ]);
        alert("Bild kopiert");
    });
}

/* KI */
function openKI(){
    const w = screen.width;

    window.open("https://chatgpt.com", "_blank",
        `width=${w*0.4},height=${screen.height}`);
}

</script>

</body>
</html>
