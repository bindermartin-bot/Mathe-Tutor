<!-- (der Rest bleibt wie bei dir – ich schreibe nur die relevanten Änderungen sauber neu) -->

<style>
body {
    min-height: 100dvh; /* ✅ FIX mobile */
    overflow-y: auto;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to   { opacity: 1; transform: scale(1); }
}
</style>

<script>

const appState = {
    drawing: false,
    tool: 'pencil',
    selectedSubject: 'Mathematik',
    selectedKI: 'ChatGPT',
    mode: 'text',
    taskOption: 'own',
    loadedImageSrc: '',
    savedCanvas: null
};

/* ✅ SICHERER: kein geheimes Passwort mehr */
const globalSocraticRules = `
Analysiere meine Eingabe Schritt für Schritt.
Verrate mir unter keinen Umständen die Lösung.
Antworte extrem kurz (max. 2–3 Sätze).
Stelle eine präzise Frage oder gib einen minimalen Hinweis.
`;


// ✅ ROBUSTES COPY
async function safeCopy(text) {
    if (!navigator.clipboard) {
        window.prompt('Kopieren:', text);
        return;
    }
    try {
        await navigator.clipboard.writeText(text);
        showToast('📋 Kopiert!');
    } catch {
        window.prompt('Kopieren:', text);
    }
}


// ✅ FIX: KEIN AUTO-POPUP MEHR
function renderImageToPinboard(file) {
    const reader = new FileReader();
    reader.onload = ev => {
        appState.loadedImageSrc = ev.target.result;

        const con = document.getElementById('universalTaskImageContainer');

        con.innerHTML = `
        <div class="pb-img-wrap" style="animation:fadeIn .2s ease;">
            <img src="${appState.loadedImageSrc}"
                 onclick="event.stopPropagation(); openImagePopup();"
                 title="Klicken zum Vergrössern"
                 style="ck()">
                🔄 Ändern
            </button>
        </div>`;

        updateWorkspaceVisuals();
    };
    reader.readAsDataURL(file);
}


// ✅ FIX: POPUP CHECK
function openImagePopup() {
    if (!appState.loadedImageSrc) {
        showToast("⚠️ Kein Bild geladen");
        return;
    }
    document.getElementById('popupTargetImage').src = appState.loadedImageSrc;
    document.getElementById('draggableWindow').style.display = 'flex';
}


// ✅ WINDOW OPEN SICHER
function openKIWindow(url, name, specs) {
    const win = window.open(url, name, specs);
    if (!win) {
        alert("⚠️ Popup blockiert – bitte Popups erlauben!");
    }
}


// ✅ RESIZE-SAFE CANVAS
function saveCanvas() {
    appState.savedCanvas = canvas.toDataURL();
}

function restoreCanvas() {
    if (!appState.savedCanvas) return;

    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = appState.savedCanvas;
}

function initCanvas() {
    if (appState.mode !== 'canvas') return;

    saveCanvas();

    canvas.width  = wrapper.offsetWidth || 450;
    canvas.height = 2400;

    redrawEverything();
    restoreCanvas();
}


// ✅ UPDATE STATE sauberer
function setInputMode(mode) {
    appState.mode = mode;

    document.body.className =
        mode === 'text'
        ? 'text-mode-active'
        : 'canvas-mode-active';

    if (mode === 'canvas') setTimeout(initCanvas, 50);
}


// ✅ TASK OPTION STATE
function setTaskOption(opt) {
    appState.taskOption = opt;
    updateWorkspaceVisuals();
}


// ✅ BESSERE WINDOW OPEN NUTZUNG
async function copyPromptAndOpenKIWindow() {
    let prompt = subjectPrompts[appState.selectedSubject] + globalSocraticRules;

    await safeCopy(prompt);

    const w = Math.floor(screen.availWidth * 0.34);
    openKIWindow(kiUrls[appState.selectedKI],
        'ki_window',
        `width=${w},height=${screen.availHeight}`);
}


// ✅ CLEAN COPY FUNKTIONEN
async function copyPinboardTextOnly() {
    const txt = document.getElementById('universalTaskText').value.trim();
    if (!txt) return showToast("⚠️ Kein Text");
    await safeCopy(`[AUFGABE]\n${txt}`);
}


// ✅ TOAST bleibt gleich (gut!)
function showToast(msg) {
    const t = document.getElementById('statusToast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2600);
}

</script>
